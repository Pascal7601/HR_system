<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR System — Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand">Vunoh Global HR</span>
      </div>
      <div class="topbar-right">
        <span id="user-name" class="user-name"></span>
        <span id="user-role" class="role-badge"></span>
        <button id="logout-btn" class="btn-ghost">Log out</button>
      </div>
    </header>

    <div class="period-bar">
      <label for="period-month">Period</label>
      <select id="period-month"></select>
      <select id="period-year"></select>

      <!-- HR-only control, shown/hidden via JS -->
      <button id="generate-payroll-btn" class="btn-primary" hidden>
        Generate payroll for this period
      </button>
    </div>

    <main class="dashboard-grid">
      <!-- NEW: Employee Profile Section -->
      <section class="card card-full-width" id="section-profile">
        <div class="card-header">
          <h2>My Profile</h2>
        </div>
        <div class="card-body" id="profile-body" data-state="loading">
          <p class="state-loading">Loading profile details…</p>
        </div>
      </section>

      <!-- HR / Dept Manager section -->
      <section class="card" id="section-pending-approvals" hidden>
        <h2>Pending approvals</h2>
        <div class="card-body" data-state="loading">
          <p class="state-loading">Loading pending requests…</p>
        </div>
      </section>

      <!-- Shown to everyone -->
      <section class="card" id="section-whos-out">
        <h2>Who's out / when</h2>
        <div class="card-body" data-state="loading">
          <p class="state-loading">Loading…</p>
        </div>
      </section>

      <!-- Shown to everyone -->
      <section class="card" id="section-leave-balances">
        <h2 id="leave-balances-title">Leave balances</h2>
        <div class="card-body" data-state="loading">
          <p class="state-loading">Loading…</p>
        </div>
        <!-- Employee-only control -->
        <button id="request-leave-btn" class="btn-secondary" hidden>
          Request leave
        </button>
      </section>

      <!-- Shown to everyone -->
      <section class="card" id="section-payslips">
        <div class="card-header">
          <h2 id="payslips-title">Payslips</h2>
          <button id="export-payslips-btn" class="btn-ghost" hidden>
            Export to Excel
          </button>
        </div>
        <div class="card-body" data-state="loading">
          <p class="state-loading">Loading…</p>
        </div>
      </section>

      <div id="leave-modal-overlay" class="modal-overlay" hidden>
        <div
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="leave-modal-title"
        >
          <h2 id="leave-modal-title">Request leave</h2>
          <form id="leave-request-form">
            <label for="leave-type-select">Leave type</label>
            <select id="leave-type-select" required></select>

            <label for="leave-start-date">Start date</label>
            <input type="date" id="leave-start-date" required />

            <label for="leave-end-date">End date</label>
            <input type="date" id="leave-end-date" required />

            <label for="leave-reason">Reason (optional)</label>
            <textarea id="leave-reason" rows="3"></textarea>

            <p id="leave-form-error" class="state-error" hidden></p>

            <div class="modal-actions">
              <button type="button" id="leave-cancel-btn" class="btn-secondary">
                Cancel
              </button>
              <button type="submit" id="leave-submit-btn" class="btn-primary">
                Submit request
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
